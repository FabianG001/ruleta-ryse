<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta RYSE 2027</title>
    <link rel="icon" type="image/png" href="assets/img/logo-ryse.png">
    <link rel="stylesheet" href="css/styles.css">

    <!-- Slider -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bxslider@4.2.17/dist/jquery.bxslider.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bxslider@4.2.17/dist/jquery.bxslider.min.js"></script>

    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>

    <header id="slider">
        <div class="slider-wrapper">
            <ul class="bxslider">
                <li><img src="assets/img/slider1.jpg"></li>
                <li><img src="assets/img/slider2.jpg"></li>
                <li><img src="assets/img/slider3.jpg"></li>
            </ul>
        </div>
    </header>

    <div class="main-container">
        <div class="ruleta-container">
            <div class="users-container">
                <p><i class="fas fa-gift"></i>Premio en juego:</p>
                <input type="text" id="premioInput" placeholder="Escribe el premio de esta ronda">
            </div>
            <div class="visor">
                <div id="listaColaboradores"></div>
            </div>

            <div class="controls">
                <button onclick="girar()" id="btn-girar"><i class="fa-solid fa-rotate-right" id="icono-ruleta"></i>Girar
                    Ruleta</button>
            </div>

            <h1 id="ganador"></h1>
        </div>
        <div class="historial">
            <div class="historial-container">
                <h3>🏆 Historial de Ganadores 🏆</h3>
                <ul id="listaGanadores"></ul>
            </div>
            <button class="btnHistorial" onclick="ExportarGanadores()">
                <i class="fas fa-download"></i> Descargar Historial
            </button>
            <button class="btnHistorial" onclick="pantallaCompleta()">
                <i class="fas fa-expand"></i> Pantalla Completa
            </button>
        </div>
    </div>

    <footer class="creditos">
        <p>&copy; Fabián González - Soporte TI</p>
        <p>Ryse 2027</p>
    </footer>

    <script>
        $(document).ready(function () {
            $('.bxslider').bxSlider({
                mode: 'fade',
                auto: true,
                pause: 4000,
                speed: 1000,
                controls: false
            });
        });
    </script>

    <!-- Librería para exportar a Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
