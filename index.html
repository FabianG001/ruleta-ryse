<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta RYSE 2026</title>

    <link rel="icon" type="image/png" href="assets/img/logo-ryse.png">
    <link rel="stylesheet" href="css/styles.css">

    <!-- Slider -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bxslider@4.2.17/dist/jquery.bxslider.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bxslider@4.2.17/dist/jquery.bxslider.min.js"></script>
</head>

<body>

    <header id="slider">
        <div class="slider-wrapper">
            <ul class="bxslider">
                <li><img src="assets/img/slider1.jpg"></li>
                <li><img src="assets/img/slider2.jpg"></li>
                <li><img src="assets/img/slider3.jpg"></li>
            </ul>
        </div>
    </header>

    <div class="main-container">
        <div class="ruleta-container">
            <p>Participantes:</p>
            <div class="visor">
                <div id="listaColaboradores"></div>
            </div>

            <div class="controls">
                <button onclick="girar()">Girar Ruleta</button>
            </div>

            <h1 id="ganador"></h1>
        </div>

        <div class="historial-container">
            <h3>🏆 Historial de Ganadores</h3>
            <ul id="listaGanadores"></ul>
        </div>
    </div>


    <footer class="creditos">
        <p>&copy; Fabián González - Soporte TI</p>
        <p>Ryse 2027</p>
    </footer>

    <script>
        $(document).ready(function () {
            $('.bxslider').bxSlider({
                mode: 'fade',
                auto: true,
                pause: 3000,
                speed: 1000,
                controls: false
            });
        });
    </script>

    <script src="JS/script.js"></script>
</body>

</html>
